name: Auto-merge

on:
  check_suite:
    types: [completed]
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: auto-merge-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: Habilitar auto-merge
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Habilitar auto-merge con squash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Mientras el repositorio no tenga activado "Allow auto-merge", avisa sin fallar.
          if salida=$(gh pr merge ${{ github.event.pull_request.number }} \
            --auto --squash \
            --repo ${{ github.repository }} 2>&1); then
            echo "$salida"
          elif grep -q 'enablePullRequestAutoMerge' <<<"$salida"; then
            echo "::notice::El repositorio no permite auto-merge: falta activar Allow auto-merge en Settings > General."
          else
            echo "$salida"
            exit 1
          fi
