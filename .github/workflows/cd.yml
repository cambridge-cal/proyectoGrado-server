name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Construir y publicar imagen Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Iniciar sesión en GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extraer metadatos de Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Construir y publicar imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # Despliegue a la máquina de Azure for Students (docs/produccion.md).
  # Se activa con la variable del repositorio DEPLOY_HABILITADO = true y estos secretos:
  #   DEPLOY_HOST: dominio del servidor (sistema-cal.westus2.cloudapp.azure.com)
  #   DEPLOY_USER: usuario SSH (azureuser)
  #   DEPLOY_KEY:  clave privada SSH de despliegue
  deploy:
    name: Desplegar a producción
    needs: build-and-push
    runs-on: ubuntu-latest
    if: vars.DEPLOY_HABILITADO == 'true'
    environment:
      name: production
      url: https://sistema-cal.westus2.cloudapp.azure.com
    steps:
      - name: Desplegar vía SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/despliegue
          chmod 600 ~/.ssh/despliegue
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/despliegue "$DEPLOY_USER@$DEPLOY_HOST" \
            /opt/sistema-cal/servidor/despliegue/actualizar.sh
